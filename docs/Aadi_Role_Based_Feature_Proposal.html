<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aadi — Business Performance &amp; Project Profitability · Interactive Product Proposal</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#1c2433;--mute:#5f6b7e;--line:#e3e8ef;--acc:#2f5bea;--acc-s:#e9eefd;--ok:#12805c;--ok-s:#e3f6ee;--warn:#9a6700;--warn-s:#fff4d6;--bad:#b42318;--bad-s:#fde8e6;--info:#0b6e99;--info-s:#e1f3fa;--sb:#111a2e;--sb-ink:#c9d3e6;--r:10px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px;z-index:100}.skip:focus{left:8px;top:8px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside.sb{background:var(--sb);color:var(--sb-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:#8fa0c0;font-size:11px}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7f90b2;padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--sb-ink);padding:9px 10px;border-radius:8px}
.nav:hover{background:#1c2845}.nav[aria-current=page]{background:var(--acc);color:#fff}
.nav .ic{width:20px;text-align:center}.nav .lk{margin-left:auto;font-size:12px;opacity:.7}
.nav[aria-disabled=true]{opacity:.5}
.sbfoot{margin-top:auto;font-size:11px;color:#8fa0c0;padding:10px 8px;border-top:1px solid #243255}
main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 24px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner{background:var(--warn-s);color:var(--warn);border:1px solid #f1d98b;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
.menu-btn{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.spacer{flex:1}
.who{font-size:12px;color:var(--mute);text-align:right}.who b{color:var(--ink);display:block;font-size:13px}
.roles{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.roles label{white-space:nowrap}
.rp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.rp:hover{border-color:var(--acc);color:var(--acc)}
.rp[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.rp .tag{font-size:10px;font-weight:700;background:rgba(0,0,0,.08);border-radius:6px;padding:0 5px}
.rolesel{display:none;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.content{padding:22px 24px 60px;max-width:1400px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{padding:0;overflow:hidden}
.card>h2:first-child{margin-top:0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g32{grid-template-columns:3fr 2fr}
.mb{margin-bottom:14px}
.kpi .l{color:var(--mute);font-size:12px;display:flex;gap:4px;align-items:center}
.kpi .v{font-size:24px;font-weight:700;margin:2px 0}.kpi .s{font-size:12px;color:var(--mute)}
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#e7ebf3;color:#44506a;font-size:10px;font-weight:700;cursor:help;border:0;padding:0}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f6;color:#445068;white-space:nowrap}
.c-ok{background:var(--ok-s);color:var(--ok)}.c-warn{background:var(--warn-s);color:var(--warn)}.c-bad{background:var(--bad-s);color:var(--bad)}.c-info{background:var(--info-s);color:var(--info)}.c-acc{background:var(--acc-s);color:var(--acc)}
.p1{background:#e9eefd;color:#2f5bea}.p2{background:#fdeaf3;color:#b0286a}.p3{background:#efe8fd;color:#6a38c7}
.pill-p{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.bar{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;min-width:70px}.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.ok>i{background:#17a673}.bar.warn>i{background:#e0a100}.bar.bad>i{background:#d92d20}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f8fafc;color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select,.f input,.f select,.f textarea{border:1px solid #cfd6e2;background:#fff;border-radius:8px;padding:7px 10px}
.btn{border:1px solid #cfd6e2;background:#fff;border-radius:8px;padding:7px 13px;font-weight:600}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:#2449c2;color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.can{margin:0;padding-left:18px}.can li{margin:2px 0}
.lock{background:var(--bad-s);border:1px solid #f4c3bd;color:#7a1b12;border-radius:var(--r);padding:28px;text-align:center}
.lock .big{font-size:34px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.note{background:var(--info-s);border:1px solid #b9e0ef;color:#0b5575;border-radius:8px;padding:9px 12px;font-size:13px}
.note.w{background:var(--warn-s);border-color:#f1d98b;color:#6f4a00}
.rolecard{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.rolecard .cap{flex:1;min-width:260px}
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#eef1f6;border-radius:10px;padding:8px;min-height:120px}
.col h3{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.tk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;font-size:12.5px}
.tk b{display:block;font-size:13px}.tk select{width:100%;margin-top:6px;font-size:12px;padding:3px;border:1px solid #cfd6e2;border-radius:6px}
.tk.bl{border-color:#f0b4ac;background:#fff8f7}
.cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding:6px 0 0}
.cg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cb{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.cb i{display:block;width:40%;max-width:26px;border-radius:5px 5px 0 0}
.cb .t{background:#c9d4f5}.cb .a{background:var(--acc)}
.cg small{color:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .vl{text-align:right;font-variant-numeric:tabular-nums}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.flex{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mx th,.mx td{text-align:center;padding:7px 8px;font-size:12.5px}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:230px}
.mx th:first-child{background:#f8fafc}
.mx .sel{background:var(--acc-s)}
.pv{display:inline-block;min-width:78px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.v-Full{background:#d6f1e5;color:#0b6a49}.v-Manage{background:#dbe7ff;color:#1c43b8}.v-View{background:#e8eef6;color:#3d4f6b}.v-Own{background:#fff0c9;color:#7a5400}.v-Delegated{background:#efe3fd;color:#5b2da8}.v-No{background:#f3f4f6;color:#98a1b0}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;position:relative}
.step:hover{border-color:var(--acc)}
.step.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-s)}
.step.on{background:var(--acc-s)}
.step .no{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;margin-bottom:6px}
.step b{display:block;font-size:13px;margin-bottom:4px}
.step .rr{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.step .rr span{font-size:10.5px;background:#eef1f6;border-radius:5px;padding:0 5px;color:#445068}
.step .rr span.m{background:var(--acc);color:#fff}
.chain{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-weight:600}
.chain span{background:var(--acc-s);color:var(--acc);padding:3px 10px;border-radius:999px;font-size:12.5px}.chain i{color:#98a1b0;font-style:normal}
dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 28px);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(10,20,40,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0}.db{padding:16px 18px;max-height:70vh;overflow:auto}.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{border:0;background:none;font-size:20px;line-height:1}
.f{display:grid;gap:10px}.f label{display:grid;gap:3px;font-weight:600;font-size:12.5px}.f textarea{min-height:60px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:#17213a;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:92vw;font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ai{border:1px dashed #b9a3ec;background:#faf7ff}
.ai .q{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--mute);font-weight:600}
.tab[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
.scrim{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g32{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside.sb{position:fixed;left:0;top:0;z-index:60;width:270px;transform:translateX(-100%);transition:.25s}
 body.nav-open aside.sb{transform:none}
 body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50}
 .menu-btn{display:inline-block}
 .roles{display:none}.rolesel{display:block}
 .top{padding:10px 14px}.content{padding:16px 14px 50px}
 .g2,.g3,.g4{grid-template-columns:1fr}.steps{grid-template-columns:1fr}
 .who{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
 <aside class="sb" id="sb" aria-label="Primary">
  <div class="brand"><div class="logo">A</div><div><b>Aadi Performance</b><small>Profitability Platform</small></div></div>
  <div class="navh">Workspace</div>
  <nav id="nav" aria-label="Modules"></nav>
  <div class="sbfoot">Proposal prototype · no login, no backend, no data saved. Menu reflects the selected role's proposed access.</div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main>
  <header class="top">
   <div class="toprow">
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰ Menu</button>
    <span class="banner">Interactive Product Proposal — Illustrative Data</span>
    <span class="spacer"></span>
    <div class="who" id="who"></div>
   </div>
   <div class="roles" id="roles" role="group" aria-label="Select role to preview"></div>
   <select class="rolesel" id="roleSel" aria-label="Select role to preview"></select>
  </header>
  <div class="content" id="view" tabindex="-1"></div>
 </main>
</div>
<dialog id="dlg" aria-labelledby="dt"><div class="dh"><h2 id="dt"></h2><button class="x" id="dx" aria-label="Close">×</button></div><div class="db" id="dbody"></div><div class="df" id="dfoot"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=n=>'₹'+(Math.abs(n)>=100?(n/100).toFixed(2)+' Cr':n.toFixed(1)+' L'); // values stored in lakhs
const pct=(a,b)=>b?Math.round(a/b*100):0;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const tone=p=>p>=90?'ok':p>=65?'warn':'bad';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3400)}
const demo=a=>toast('Prototype only: “'+a+'” is illustrative. No data is saved.');
const TIP={
 'Revenue target achievement':'Recognized actual revenue ÷ target revenue × 100. Revenue basis (invoiced / collected / recognized / milestone) is an open decision.',
 'Contribution':'Recognized revenue − direct project cost − allocated overhead. Proposed formula; to be validated with the customer’s accountant.',
 'Contribution margin':'Project contribution ÷ recognized revenue × 100 (zero revenue handled separately).',
 'Utilization':'Approved productive hours ÷ available working hours × 100. Not a measure of employee quality.',
 'Estimate variance':'Actual approved hours − estimated hours (and % of estimate).',
 'Outstanding':'Invoice total − recorded payments − credits/adjustments.',
 'Allocated overhead':'Shared costs (rent, Wi‑Fi, hosting, AI subscriptions…) distributed using the selected allocation method.'
};
const tip=k=>TIP[k]?` <button class="tip" type="button" aria-label="${esc(k)}: ${esc(TIP[k])}" title="${esc(TIP[k])}">?</button>`:'';
const chip=(t,c)=>`<span class="chip ${c?'c-'+c:''}">${esc(t)}</span>`;
const stTone={Active:'ok',Planned:'info','On Hold':'warn',Completed:'ok',Green:'ok',Amber:'warn',Red:'bad',Draft:'',Submitted:'info',Approved:'ok',Returned:'warn',Rejected:'bad',Issued:'info','Partially Paid':'warn',Paid:'ok',Overdue:'bad',Void:'',Pending:'warn',Acknowledged:'ok',Initiated:'info','Pending acknowledgement':'warn'};
const sChip=s=>chip(s,stTone[s]);
const bar=(p,t)=>`<div class="bar ${t||tone(p)}" role="img" aria-label="${p}%"><i style="width:${Math.min(100,p)}%"></i></div>`;
const pillar=n=>`<span class="pill-p p${n}" title="${['','Pillar 1 — Software Product','Pillar 2 — Marketing & Sales','Pillar 3 — AI Solutions'][n]}">P${n}</span>`;
function kpi(l,v,s,t){return `<div class="card kpi"><div class="l">${esc(l)}${tip(t||l)}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`}
function table(cols,rows,empty){
 if(!rows.length)return `<div class="empty">${empty||'No records match the current filters.'}</div>`;
 return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.r?c.r(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function hbars(items,fmt,max){
 const m=max||Math.max(...items.map(i=>i.v),1);
 return items.map(i=>`<div class="hb"><span class="nm" title="${esc(i.n)}">${esc(i.n)}</span><div class="bar ${i.t||''}"><i style="width:${i.v/m*100}%"></i></div><span class="vl">${fmt?fmt(i.v):i.v}</span></div>`).join('');
}
function colChart(labels,t,a){
 const m=Math.max(...t,...a);
 return `<div class="cols" role="img" aria-label="Monthly target versus actual chart">${labels.map((l,i)=>`<div class="cg"><div class="cb"><i class="t" style="height:${t[i]/m*100}%" title="Target ${t[i].toFixed(1)} L"></i><i class="a" style="height:${a[i]/m*100}%" title="Actual ${a[i].toFixed(1)} L"></i></div><small>${l}</small></div>`).join('')}</div><div class="legend"><span><i class="sw" style="background:#c9d4f5"></i>Target</span><span><i class="sw" style="background:var(--acc)"></i>Actual</span><span>Illustrative · ₹ lakhs</span></div>`;
}
function donut(items){
 const tot=sum(items,i=>i.v);let acc=0;
 const g=items.map(i=>{const s=acc/tot*100;acc+=i.v;return `${i.c} ${s}% ${acc/tot*100}%`}).join(',');
 return `<div class="flex"><div class="donut" role="img" aria-label="Distribution chart" style="background:conic-gradient(${g})"></div><div>${items.map(i=>`<div><i class="sw" style="background:${i.c}"></i>${esc(i.n)} <b>${i.l||i.v}</b></div>`).join('')}</div></div>`;
}
const searchBar=(id,ph,extra)=>`<div class="tools"><label class="sr" for="${id}" style="position:absolute;left:-999px">${ph}</label><input id="${id}" type="search" placeholder="${ph}" value="${esc(ui[id]||'')}">${extra||''}</div>`;
const sel=(id,label,opts)=>`<label style="display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute)">${label}<select id="${id}">${opts.map(o=>`<option ${String(ui[id]??opts[0])===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
const match=(o,q)=>!q||JSON.stringify(Object.values(o)).toLowerCase().includes(q.toLowerCase());

/* ============ sample data (fictional & illustrative) ============ */
const MONTHS=['Jun','Jul','Aug','Sep','Oct','Nov'];
const TGT=[8,9,10,10,11,12],ACT=[6.2,7.5,8.4,6.9,9.1,7.6];
const BASIS={'Recognized':1,'Invoiced':1.08,'Collected':.82,'Milestone-based':.9};
const CATS=[
 {n:'Infrastructure',v:2.4},{n:'Third Party Solutions',v:3.1},{n:'Software',v:2.2},{n:'Marketing',v:1.5},{n:'Sales',v:1.2},{n:'Consulting',v:2.6},{n:'Salary',v:22.0,restricted:true}];
const PRJ=[
 {id:'PRJ-101',n:'Retail Portal Revamp',c:'Northwind Retail',pm:'Asha',s:'Active',h:'Amber',bud:18,rev:12.5,cost:7.4,oh:1.1,est:900,act:842,p:68,mem:5,scope:'Storefront redesign, checkout, catalogue filters, admin console',ms:['Design sign-off ✔','Checkout beta (in progress)','UAT','Go-live']},
 {id:'PRJ-102',n:'Learning App Pilot',c:'Lumen Academy',pm:'Asha',s:'Active',h:'Green',bud:9,rev:6.0,cost:3.1,oh:.6,est:520,act:455,p:74,mem:3,scope:'Quiz engine, teacher dashboard, progress reports',ms:['Prototype ✔','Pilot release (in progress)','Feedback round']},

 if(r==='pm'){
  return head('Expenses & Cost','Raise cost requests for assigned projects. Approval and recording are done by Finance.')+
  `<div class="tools"><button class="btn pri" data-demo="Submit project cost request">+ Cost request</button></div><div class="card flat">${table([{h:'Request',k:'n'},{h:'Project',k:'p'},{h:'Category',k:'c'},{h:'Amount',n:1,r:x=>L(x.a)},{h:'Status',r:x=>sChip(x.s)}],[{n:'Staging server (3 months)',p:'PRJ-101',c:'Infrastructure',a:.6,s:'Submitted'},{n:'Icon licence',p:'PRJ-102',c:'Software',a:.1,s:'Approved'}])}</div><p class="note" style="margin-top:12px">Salary cost, cost rates and other projects’ costs are not visible to this role.</p>`;
 }
 const full=r==='ceo'||r==='fin',pool=4.5;
 const w={ 'Equal share':PRJ.map(()=>1),'Percentage (manual %)':[30,20,20,15,5,10],'Headcount':PRJ.map(p=>p.mem),'Approved hours':PRJ.map(p=>p.act),'Manual amounts':[1.2,.8,.9,.7,.4,.5]}[state.alloc];
 const tw=sum(w,x=>x),al=state.alloc==='Manual amounts'?w:w.map(x=>x/tw*pool);
 const cats=CATS.filter(c=>full||!c.restricted);
 return head('Expenses & Cost',full?'Category spend, direct vs shared cost and allocation. Salary cost is restricted to authorized roles.':'Summary view. Salary and cost rates are hidden for your role.')+
 `<div class="grid g2 mb"><div class="card"><h2>Spend by category</h2>${hbars(cats.map(c=>({n:c.n,v:c.v,t:c.restricted?'warn':''})),v=>L(v))}${full?'':'<div class="note w" style="margin-top:8px">🔒 Salary &amp; cost rates: restricted to Owner and Finance.</div>'}</div>
 <div class="card"><h2>Shared overhead pool ${tip('Allocated overhead')}</h2><p style="margin:0 0 8px">Rent, Wi‑Fi, hosting, AI subscriptions: <b>${L(pool)}</b> (sample)</p>${full?`<label>Allocation method <select id="alloc">${['Equal share','Percentage (manual %)','Headcount','Approved hours','Manual amounts'].map(m=>`<option ${m===state.alloc?'selected':''}>${m}</option>`).join('')}</select></label>`:`<p>Method: <b>${state.alloc}</b> (view only)</p>`}<p class="note" style="margin-top:10px">Method and period stay visible and auditable. Allocation total reconciles: ${L(sum(al,x=>x))} ✔</p></div></div>
 <div class="card flat mb"><div style="padding:14px 16px 0"><h2>Allocation by project</h2></div>${table([{h:'Project',k:'n'},{h:'Direct cost',n:1,r:(p)=>full?L(p.cost):'—'},{h:'Allocated overhead',n:1,r:p=>L(al[PRJ.indexOf(p)])}],PRJ)}</div>
 ${full?`<div class="tools"><button class="btn pri" data-demo="Record expense with category, vendor, allocation and attachment">+ Record expense</button><button class="btn" data-demo="Export expenses (CSV/XLSX)">Export</button><button class="btn" data-demo="Run reconciliation">Reconcile</button></div><div class="note">Source-sheet totals (e.g. the workbook’s displayed total) must be reconciled before being treated as actual cost. Salary uses approved cost rates × approved effort; method is an open decision.</div>`:''}`;
};

VIEWS.invoices=()=>{
 const r=state.role,fin=r==='fin',ceo=r==='ceo';
 if(r==='pm'){
  return head('Invoices','You may request an invoice draft for assigned projects. Issuing is restricted to Finance.')+`<div class="tools"><button class="btn pri" data-demo="Request invoice draft for milestone / approved billable time">+ Request draft</button></div><div class="card flat">${table([{h:'Request',k:'n'},{h:'Project',k:'p'},{h:'Basis',k:'b'},{h:'Status',r:x=>sChip(x.s)}],[{n:'Draft request #1',p:'PRJ-101',b:'Milestone: Checkout beta',s:'Submitted'}])}</div>`;
 }
 const f=ui.f7||'All';let I=INV.filter(i=>(f==='All'||i.s===f)&&match(i,ui.q7||''));
 const act=i=>{
  if(fin||ceo){
   if(i.s==='Draft'||i.s==='Void')return fin?`<button class="btn sm" data-inv="${i.id}:Approved">Submit for approval</button>`:'—';
   if(i.s==='Approved')return fin?`<button class="btn sm pri" data-inv="${i.id}:Issued">Issue</button>`:`<button class="btn sm" data-demo="Approve ${i.id}">Review</button>`;
   if(fin&&['Issued','Partially Paid','Overdue'].includes(i.s))return `<button class="btn sm" data-inv="${i.id}:Paid">Record payment</button>`;
  } return '—';};
 return head('Invoices','Invoice preparation, approval, payments and receivables. Exact invoice scope needs customer confirmation.')+
 `<div class="grid g3 mb">${kpi('Outstanding',L(outstanding()),'Issued + part-paid + overdue','Outstanding')}${kpi('Overdue',L(sum(INV.filter(i=>i.s==='Overdue'),i=>i.amt-i.paid)),'Chase now')}${kpi('Drafts / awaiting approval',INV.filter(i=>['Draft','Approved'].includes(i.s)).length,'Not yet issued')}</div>`+
 searchBar('q7','Search invoices…',sel('f7','Status',['All','Draft','Approved','Issued','Partially Paid','Paid','Overdue'])+(fin?'<button class="btn pri" data-demo="Create draft from milestones or approved billable timesheets">+ New draft</button><button class="btn" data-demo="Export invoice PDF">Export PDF</button>':''))+
 `<div class="card flat">${table([{h:'Invoice',k:'id'},{h:'Customer',k:'c'},{h:'Project',k:'p'},{h:'Total',n:1,r:i=>L(i.amt)},{h:'Paid',n:1,r:i=>L(i.paid)},{h:'Balance',n:1,r:i=>L(i.amt-i.paid)},{h:'Due',k:'due'},{h:'Status',r:i=>sChip(i.s)},{h:'Action',r:act}],I)}</div><p class="note" style="margin-top:12px">Tax/GST fields, invoice numbering and PDF format are <b>not assumed</b>; they await customer and accountant validation.</p>`;
};

VIEWS.matrix=()=>{
 const rf=state.mxRole,q=ui.q8||'';
 const cols=MXROLES.filter(([k])=>rf==='All'||k===rf||k===state.role);
 const rows=MX.filter(m=>!q||m[0].toLowerCase().includes(q.toLowerCase()));
 const cls=v=>'v-'+(v==='No Access'?'No':v);
 return head('Role & Permission Matrix','Proposed starting permissions across modules. Final permissions are configurable and enforced by backend APIs.')+
 `<div class="note mb"><b>Proposal, not approval.</b> Role names, delegation and scope rules require customer approval. The prototype uses capabilities, not hardcoded role names.</div>`+
 searchBar('q8','Filter modules…',`<label style="display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute)">Role<select id="mxRole"><option value="All">All roles</option>${MXROLES.map(([k,n])=>`<option value="${k}" ${rf===k?'selected':''}>${n}</option>`).join('')}</select></label>`)+
 `<div class="legend" style="margin:0 0 10px">${['Full','Manage','View','Own','Delegated','No Access'].map(v=>`<span><span class="pv ${cls(v)}">${v}</span></span>`).join('')}<span>Delegated = by assignment/delegation scope · Own = own records only</span></div>
 <div class="card flat"><div class="tw"><table class="mx"><thead><tr><th scope="col">Module</th>${cols.map(([k,n])=>`<th scope="col" class="${k===state.role?'sel':''}">${n}${k===state.role?'<br><small>(you)</small>':''}</th>`).join('')}</tr></thead><tbody>${rows.map(m=>`<tr><td><b>${m[0]}</b> ${pillar(m[1])}<br><small>MVP: ${m[2]}</small></td>${cols.map(([k])=>{const v=m[3][MXROLES.findIndex(x=>x[0]===k)];return `<td class="${k===state.role?'sel':''}"><span class="pv ${cls(v)}">${v}</span></td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+1}"><div class="empty">No modules match “${esc(q)}”.</div></td></tr>`}</tbody></table></div></div>
 <p class="note" style="margin-top:12px"><b>HR / People Manager</b> is an <span class="chip c-warn">Optional / customer decision</span> and is <u>not</u> confirmed MVP scope. Platform Administrator has no default access to tenant business content.</p>`;
};

VIEWS.workflow=()=>{
 const r=state.role,sIx=state.wf,s=WF[sIx];
 const names=Object.fromEntries(ROLES.map(x=>[x.id,x.short]));
 const maps=[['Matrix/Invoice – Employee Performance','Employee contribution matrix, project/customer cost matrix, invoice preparation and tracking.','Exact invoice scope requires confirmation','perf'],['Sprint Planning – To team transition','Sprint planning, task assignment, reassignment and auditable handover.','Cadence and meaning of “transition” to confirm','handover'],['Target – Revenue','Target set-up and actual-vs-target dashboard with variance.','Revenue basis and target level to decide','revenue'],['Timesheet – To capture details','Work logs, time entry, approval and estimate-vs-actual.','Approval hierarchy to confirm','timesheets']];
 return head('Product Workflow','How revenue connects to performance. Steps where the selected role participates are highlighted.')+
 `<div class="chain" aria-label="Value chain">${['Revenue','Customer / Project','Sprint / Tasks','Employee','Timesheet','Cost','Invoice','Performance'].map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div>
 <div class="steps mb">${WF.map((w,i)=>`<button type="button" class="step ${w[2].includes(r)?'me':''} ${i===sIx?'on':''}" data-step="${i}" aria-pressed="${i===sIx}"><div class="no">${i+1}</div><b>${w[0]}</b><div class="rr">${w[2].map(x=>`<span class="${x===r?'m':''}">${names[x]}</span>`).join('')}</div></button>`).join('')}</div>
 <div class="card mb"><h2>Step ${sIx+1}: ${s[0]}</h2><p>${s[1]}</p><p>Participating roles: ${s[2].map(x=>chip(names[x],x===r?'acc':'')).join(' ')}</p>${access(s[3])?`<button class="btn" data-go="${s[3]}">Open related screen →</button>`:`<span class="chip c-bad">🔒 Related screen is restricted for your role</span>`}</div>
 <h2>Customer input → proposed capability</h2><div class="grid g2">${maps.map(m=>`<div class="card"><h3>“${m[0]}”</h3><p style="margin:0 0 8px">${m[1]}</p><span class="chip c-warn">${m[2]}</span> ${access(m[3])?`<button class="btn sm" data-go="${m[3]}">Open screen</button>`:''}</div>`).join('')}</div>
 <h2 style="margin-top:20px">Three-pillar strategy</h2><div class="grid g3"><div class="card"><h3>${pillar(1)} Software Product</h3><p style="margin:0">Operations &amp; profitability: projects, sprints, timesheets, costs, invoices, dashboards. <b>Essential</b>.</p></div><div class="card"><h3>${pillar(2)} Marketing &amp; Sales</h3><p style="margin:0">Lightweight opportunity and revenue conversion visibility. No full CRM without approval. <b>Recommended / limited</b>.</p></div><div class="card"><h3>${pillar(3)} AI Solutions</h3><p style="margin:0">Advisory, permission-aware, human-reviewed insights. <b>Phase 2 pilot</b>.</p></div></div>`;
};

VIEWS.assump=()=>{
 const sup=[['Customer-wise revenue/cost matrix, owners, scope, estimated hours, progress','Supplied input'],['Four customer notes (original wording preserved)','Supplied; ambiguous'],['Profitability, utilization, forecasting, approvals, notifications, AI','Recommendation'],['Everything in this prototype’s sample data','Illustrative only']];
 return head('Assumptions & Decisions','Unresolved questions and recommended defaults. Defaults are proposals only. Nothing here is approved.')+
 `<div class="note mb">Tick “Discussed” to track your review in this session. Ticking does <b>not</b> approve anything and is not saved.</div>
 <div class="card flat mb"><div class="tw"><table><thead><tr><th>#</th><th>Open question</th><th>What we know</th><th>Recommended default (proposal)</th><th>Status</th><th>Discussed</th></tr></thead><tbody>${ASSUME.map((a,i)=>`<tr><td>${i+1}</td><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${a[2]}</td><td>${chip('Needs decision','warn')}</td><td><input type="checkbox" aria-label="Discussed: ${esc(a[0])}" ${ui['d'+i]?'checked':''} data-disc="d${i}"></td></tr>`).join('')}</tbody></table></div></div>
 <div class="grid g2"><div class="card"><h2>Evidence boundaries</h2>${table([{h:'Item',k:0},{h:'Class',r:x=>chip(x[1],x[1].startsWith('Supplied')?'info':x[1]==='Recommendation'?'warn':'')}],sup.map(x=>({0:x[0],1:x[1]})))}</div>
 <div class="card"><h2>MVP boundary (proposed)</h2><p><b>P0:</b> tenant/users/roles, customers &amp; projects, scope &amp; assignment, sprint/task with ownership history, basic handover, timesheets &amp; approval, revenue targets &amp; actuals, basic expenses, dashboards, audit trail.</p><p><b>P1:</b> performance matrix, invoices, configurable cost allocation, advanced reports.</p><p><b>P2/P3:</b> opportunity tracking, AI summaries, predictive forecasts, integrations, capacity planning.</p><p style="margin:0" class="note w">Strategy and implementation readiness are not yet approved.</p></div></div>`;
};

/* ============ modal ============ */
const dlg=$('#dlg');
function modal(title,body,okLabel,onOk){
 $('#dt').textContent=title;$('#dbody').innerHTML=body;
 $('#dfoot').innerHTML=`<button class="btn" id="dc">${okLabel?'Cancel':'Close'}</button>${okLabel?`<button class="btn pri" id="dok">${okLabel}</button>`:''}`;
 $('#dc').onclick=()=>dlg.close();
 if(okLabel)$('#dok').onclick=()=>{if(onOk()!==false)dlg.close()};
 dlg.showModal();
}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
$('#dx').onclick=()=>dlg.close();

/* ============ events ============ */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-go]');if(!t)return;
 const d=t.dataset;
 if(d.role)return setRole(d.role);
 if(d.view){return go(d.view)}
 if(d.go)return go(d.go);
 if(d.demo)return demo(d.demo);
 if(d.step){state.wf=+d.step;return render()}
 if(d.prj){const p=PRJ_MAP[d.prj],f=['ceo','fin'].includes(state.role);return modal(p.n+' · '+p.id,`<p><b>Customer:</b> ${p.c}<br><b>Scope:</b> ${p.scope}</p><h3>Milestones</h3><ul class="can">${p.ms.map(m=>`<li>${m}</li>`).join('')}</ul>${f?`<p><b>Revenue</b> ${L(p.rev)} · <b>Direct cost</b> ${L(p.cost)} · <b>Overhead</b> ${L(p.oh)}</p>`:''}<p class="note">Scope changes are recorded with date, reason, requester and approver (illustrative).</p>`)}
 if(d.ack){const h=HAND.find(x=>x.id===d.ack);h.st='Acknowledged';toast('Handover '+h.id+' acknowledged (illustrative; not saved).');return render()}
 if(d.tsa){const [id,s]=d.tsa.split(':');TS.find(x=>x.id==id).s=s;toast('Timesheet '+s.toLowerCase()+' (illustrative; comment would be recorded).');return render()}
 if(d.tssub){TS.find(x=>x.id==d.tssub).s='Submitted';toast('Submitted for approval (illustrative).');return render()}
 if(d.inv){const [id,s]=d.inv.split(':');const i=INV.find(x=>x.id===id);i.s=s;if(s==='Paid')i.paid=i.amt;toast(id+' → '+s+' (illustrative; audit entry would be written).');return render()}
 if(d.newts){return modal('Add timesheet entry',`<div class="f"><label>Project<select id="n_p">${PRJ.filter(p=>p.s!=='On Hold').map(p=>`<option value="${p.id}">${p.id} ${p.n}</option>`).join('')}</select></label><label>Task / work description<input id="n_t" maxlength="80"></label><label>Hours<input id="n_h" type="number" step="0.5" min="0.5" max="12" value="4"></label><label>Type<select id="n_b"><option>Billable</option><option>Non-billable</option></select></label></div><p class="note" style="margin-top:10px">Demo only; entry is kept in memory until you reload.</p>`,'Save as draft',()=>{
  const h=parseFloat($('#n_h').value),tx=$('#n_t').value.trim();
  if(!(h>0&&h<=12)||!tx){toast('Enter a description and 0.5–12 hours (validation example).');return false}
  TS.push({id:Date.now(),e:'Meera',d:'5 Nov',p:$('#n_p').value,t:tx,h,b:$('#n_b').value,s:'Draft'});render();toast('Draft entry added (illustrative).')})}
 if(d.handover){return modal('Initiate handover',`<div class="f"><label>Task<select>${scopedTasks().map(t=>`<option>${t.id} ${esc(t.t)}</option>`).join('')}</select></label><label>Incoming owner<select>${EMP.map(e=>`<option>${e.n}</option>`).join('')}</select></label><label>Remaining effort (h)<input type="number" value="4"></label><label>Blockers / next action<textarea></textarea></label></div>`,'Send for acknowledgement',()=>{toast('Handover initiated (illustrative; no data saved).')})}
 if(d.ai!==undefined){const A=JSON.parse($('#aiData').textContent),k=Object.keys(A)[+d.ai];return modal(k,`<p>${A[k]}</p><p class="note w">Advisory only · permission-aware · human review required · usage logged. Illustrative response, not generated from real data.</p>`)}
 if(t.id==='menuBtn'){document.body.classList.add('nav-open');return}
});
$('#scrim').onclick=()=>document.body.classList.remove('nav-open');
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(t.id==='roleSel')return setRole(t.value);
 if(t.id==='basis'){state.basis=t.value;return render()}
 if(t.id==='alloc'){state.alloc=t.value;return render()}
 if(t.id==='mxRole'){state.mxRole=t.value;return render()}
 if(d.task){TASKS.find(x=>x.id===d.task).s=t.value;toast('Task moved (illustrative; not saved).');return render()}
 if(d.disc){ui[d.disc]=t.checked;return}
 if(t.id&&/^f\d$/.test(t.id)){ui[t.id]=t.value;return render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id&&/^q\d$/.test(t.id)){ui[t.id]=t.value;render()}});
renderShell();render();
</script>
</body>
