<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aadi — Business Performance &amp; Project Profitability · Interactive Product Proposal</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#1c2433;--mute:#5f6b7e;--line:#e3e8ef;--acc:#2f5bea;--acc-s:#e9eefd;--ok:#12805c;--ok-s:#e3f6ee;--warn:#9a6700;--warn-s:#fff4d6;--bad:#b42318;--bad-s:#fde8e6;--info:#0b6e99;--info-s:#e1f3fa;--sb:#111a2e;--sb-ink:#c9d3e6;--r:10px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px;z-index:100}.skip:focus{left:8px;top:8px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside.sb{background:var(--sb);color:var(--sb-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:#8fa0c0;font-size:11px}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7f90b2;padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--sb-ink);padding:9px 10px;border-radius:8px}
.nav:hover{background:#1c2845}.nav[aria-current=page]{background:var(--acc);color:#fff}
.nav .ic{width:20px;text-align:center}.nav .lk{margin-left:auto;font-size:12px;opacity:.7}
.nav[aria-disabled=true]{opacity:.5}
.sbfoot{margin-top:auto;font-size:11px;color:#8fa0c0;padding:10px 8px;border-top:1px solid #243255}
main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 24px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner{background:var(--warn-s);color:var(--warn);border:1px solid #f1d98b;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
.menu-btn{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.spacer{flex:1}
.who{font-size:12px;color:var(--mute);text-align:right}.who b{color:var(--ink);display:block;font-size:13px}
.roles{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.roles label{white-space:nowrap}
.rp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.rp:hover{border-color:var(--acc);color:var(--acc)}
.rp[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.rp .tag{font-size:10px;font-weight:700;background:rgba(0,0,0,.08);border-radius:6px;padding:0 5px}
.rolesel{display:none;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.content{padding:22px 24px 60px;max-width:1400px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{padding:0;overflow:hidden}
.card>h2:first-child{margin-top:0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g32{grid-template-columns:3fr 2fr}
.mb{margin-bottom:14px}
.kpi .l{color:var(--mute);font-size:12px;display:flex;gap:4px;align-items:center}
.kpi .v{font-size:24px;font-weight:700;margin:2px 0}.kpi .s{font-size:12px;color:var(--mute)}
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#e7ebf3;color:#44506a;font-size:10px;font-weight:700;cursor:help;border:0;padding:0}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f6;color:#445068;white-space:nowrap}
.c-ok{background:var(--ok-s);color:var(--ok)}.c-warn{background:var(--warn-s);color:var(--warn)}.c-bad{background:var(--bad-s);color:var(--bad)}.c-info{background:var(--info-s);color:var(--info)}.c-acc{background:var(--acc-s);color:var(--acc)}
.p1{background:#e9eefd;color:#2f5bea}.p2{background:#fdeaf3;color:#b0286a}.p3{background:#efe8fd;color:#6a38c7}
.pill-p{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.bar{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;min-width:70px}.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.ok>i{background:#17a673}.bar.warn>i{background:#e0a100}.bar.bad>i{background:#d92d20}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f8fafc;color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select,.f input,.f select,.f textarea{border:1px solid #cfd6e2;background:#fff;border-radius:8px;padding:7px 10px}
.btn{border:1px solid #cfd6e2;background:#fff;border-radius:8px;padding:7px 13px;font-weight:600}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:#2449c2;color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.can{margin:0;padding-left:18px}.can li{margin:2px 0}
.lock{background:var(--bad-s);border:1px solid #f4c3bd;color:#7a1b12;border-radius:var(--r);padding:28px;text-align:center}
.lock .big{font-size:34px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.note{background:var(--info-s);border:1px solid #b9e0ef;color:#0b5575;border-radius:8px;padding:9px 12px;font-size:13px}
.note.w{background:var(--warn-s);border-color:#f1d98b;color:#6f4a00}
.rolecard{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.rolecard .cap{flex:1;min-width:260px}
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#eef1f6;border-radius:10px;padding:8px;min-height:120px}
.col h3{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.tk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;font-size:12.5px}
.tk b{display:block;font-size:13px}.tk select{width:100%;margin-top:6px;font-size:12px;padding:3px;border:1px solid #cfd6e2;border-radius:6px}
.tk.bl{border-color:#f0b4ac;background:#fff8f7}
.cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding:6px 0 0}
.cg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cb{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.cb i{display:block;width:40%;max-width:26px;border-radius:5px 5px 0 0}
.cb .t{background:#c9d4f5}.cb .a{background:var(--acc)}
.cg small{color:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .vl{text-align:right;font-variant-numeric:tabular-nums}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.flex{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mx th,.mx td{text-align:center;padding:7px 8px;font-size:12.5px}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:230px}
.mx th:first-child{background:#f8fafc}
.mx .sel{background:var(--acc-s)}
.pv{display:inline-block;min-width:78px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.v-Full{background:#d6f1e5;color:#0b6a49}.v-Manage{background:#dbe7ff;color:#1c43b8}.v-View{background:#e8eef6;color:#3d4f6b}.v-Own{background:#fff0c9;color:#7a5400}.v-Delegated{background:#efe3fd;color:#5b2da8}.v-No{background:#f3f4f6;color:#98a1b0}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;position:relative}
.step:hover{border-color:var(--acc)}
.step.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-s)}
.step.on{background:var(--acc-s)}
.step .no{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;margin-bottom:6px}
.step b{display:block;font-size:13px;margin-bottom:4px}
.step .rr{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.step .rr span{font-size:10.5px;background:#eef1f6;border-radius:5px;padding:0 5px;color:#445068}
.step .rr span.m{background:var(--acc);color:#fff}
.chain{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-weight:600}
.chain span{background:var(--acc-s);color:var(--acc);padding:3px 10px;border-radius:999px;font-size:12.5px}.chain i{color:#98a1b0;font-style:normal}
dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 28px);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(10,20,40,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0}.db{padding:16px 18px;max-height:70vh;overflow:auto}.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{border:0;background:none;font-size:20px;line-height:1}
.f{display:grid;gap:10px}.f label{display:grid;gap:3px;font-weight:600;font-size:12.5px}.f textarea{min-height:60px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:#17213a;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:92vw;font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ai{border:1px dashed #b9a3ec;background:#faf7ff}
.ai .q{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--mute);font-weight:600}
.tab[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
.scrim{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g32{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 aside.sb{position:fixed;left:0;top:0;z-index:60;width:270px;transform:translateX(-100%);transition:.25s}
 body.nav-open aside.sb{transform:none}
 body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50}
 .menu-btn{display:inline-block}
 .roles{display:none}.rolesel{display:block}
 .top{padding:10px 14px}.content{padding:16px 14px 50px}
 .g2,.g3,.g4{grid-template-columns:1fr}.steps{grid-template-columns:1fr}
 .who{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
 <aside class="sb" id="sb" aria-label="Primary">
  <div class="brand"><div class="logo">A</div><div><b>Aadi Performance</b><small>Profitability Platform</small></div></div>
  <div class="navh">Workspace</div>
  <nav id="nav" aria-label="Modules"></nav>
  <div class="sbfoot">Proposal prototype · no login, no backend, no data saved. Menu reflects the selected role's proposed access.</div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main>
  <header class="top">
   <div class="toprow">
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰ Menu</button>
    <span class="banner">Interactive Product Proposal — Illustrative Data</span>
    <span class="spacer"></span>
    <div class="who" id="who"></div>
   </div>
   <div class="roles" id="roles" role="group" aria-label="Select role to preview"></div>
   <select class="rolesel" id="roleSel" aria-label="Select role to preview"></select>
  </header>
  <div class="content" id="view" tabindex="-1"></div>
 </main>
</div>
<dialog id="dlg" aria-labelledby="dt"><div class="dh"><h2 id="dt"></h2><button class="x" id="dx" aria-label="Close">×</button></div><div class="db" id="dbody"></div><div class="df" id="dfoot"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=n=>'₹'+(Math.abs(n)>=100?(n/100).toFixed(2)+' Cr':n.toFixed(1)+' L'); // values stored in lakhs
const pct=(a,b)=>b?Math.round(a/b*100):0;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const tone=p=>p>=90?'ok':p>=65?'warn':'bad';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3400)}
const demo=a=>toast('Prototype only: “'+a+'” is illustrative. No data is saved.');
const TIP={
 'Revenue target achievement':'Recognized actual revenue ÷ target revenue × 100. Revenue basis (invoiced / collected / recognized / milestone) is an open decision.',
 'Contribution':'Recognized revenue − direct project cost − allocated overhead. Proposed formula; to be validated with the customer’s accountant.',
 'Contribution margin':'Project contribution ÷ recognized revenue × 100 (zero revenue handled separately).',
 'Utilization':'Approved productive hours ÷ available working hours × 100. Not a measure of employee quality.',
 'Estimate variance':'Actual approved hours − estimated hours (and % of estimate).',
 'Outstanding':'Invoice total − recorded payments − credits/adjustments.',
 'Allocated overhead':'Shared costs (rent, Wi‑Fi, hosting, AI subscriptions…) distributed using the selected allocation method.'
};
const tip=k=>TIP[k]?` <button class="tip" type="button" aria-label="${esc(k)}: ${esc(TIP[k])}" title="${esc(TIP[k])}">?</button>`:'';
const chip=(t,c)=>`<span class="chip ${c?'c-'+c:''}">${esc(t)}</span>`;
const stTone={Active:'ok',Planned:'info','On Hold':'warn',Completed:'ok',Green:'ok',Amber:'warn',Red:'bad',Draft:'',Submitted:'info',Approved:'ok',Returned:'warn',Rejected:'bad',Issued:'info','Partially Paid':'warn',Paid:'ok',Overdue:'bad',Void:'',Pending:'warn',Acknowledged:'ok',Initiated:'info','Pending acknowledgement':'warn'};
const sChip=s=>chip(s,stTone[s]);
const bar=(p,t)=>`<div class="bar ${t||tone(p)}" role="img" aria-label="${p}%"><i style="width:${Math.min(100,p)}%"></i></div>`;
const pillar=n=>`<span class="pill-p p${n}" title="${['','Pillar 1 — Software Product','Pillar 2 — Marketing & Sales','Pillar 3 — AI Solutions'][n]}">P${n}</span>`;
function kpi(l,v,s,t){return `<div class="card kpi"><div class="l">${esc(l)}${tip(t||l)}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`}
function table(cols,rows,empty){
 if(!rows.length)return `<div class="empty">${empty||'No records match the current filters.'}</div>`;
 return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.r?c.r(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function hbars(items,fmt,max){
 const m=max||Math.max(...items.map(i=>i.v),1);
 return items.map(i=>`<div class="hb"><span class="nm" title="${esc(i.n)}">${esc(i.n)}</span><div class="bar ${i.t||''}"><i style="width:${i.v/m*100}%"></i></div><span class="vl">${fmt?fmt(i.v):i.v}</span></div>`).join('');
}
function colChart(labels,t,a){
 const m=Math.max(...t,...a);
 return `<div class="cols" role="img" aria-label="Monthly target versus actual chart">${labels.map((l,i)=>`<div class="cg"><div class="cb"><i class="t" style="height:${t[i]/m*100}%" title="Target ${t[i].toFixed(1)} L"></i><i class="a" style="height:${a[i]/m*100}%" title="Actual ${a[i].toFixed(1)} L"></i></div><small>${l}</small></div>`).join('')}</div><div class="legend"><span><i class="sw" style="background:#c9d4f5"></i>Target</span><span><i class="sw" style="background:var(--acc)"></i>Actual</span><span>Illustrative · ₹ lakhs</span></div>`;
}
function donut(items){
 const tot=sum(items,i=>i.v);let acc=0;
 const g=items.map(i=>{const s=acc/tot*100;acc+=i.v;return `${i.c} ${s}% ${acc/tot*100}%`}).join(',');
 return `<div class="flex"><div class="donut" role="img" aria-label="Distribution chart" style="background:conic-gradient(${g})"></div><div>${items.map(i=>`<div><i class="sw" style="background:${i.c}"></i>${esc(i.n)} <b>${i.l||i.v}</b></div>`).join('')}</div></div>`;
}
const searchBar=(id,ph,extra)=>`<div class="tools"><label class="sr" for="${id}" style="position:absolute;left:-999px">${ph}</label><input id="${id}" type="search" placeholder="${ph}" value="${esc(ui[id]||'')}">${extra||''}</div>`;
const sel=(id,label,opts)=>`<label style="display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute)">${label}<select id="${id}">${opts.map(o=>`<option ${String(ui[id]??opts[0])===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
const match=(o,q)=>!q||JSON.stringify(Object.values(o)).toLowerCase().includes(q.toLowerCase());

/* ============ sample data (fictional & illustrative) ============ */
const MONTHS=['Jun','Jul','Aug','Sep','Oct','Nov'];
const TGT=[8,9,10,10,11,12],ACT=[6.2,7.5,8.4,6.9,9.1,7.6];
const BASIS={'Recognized':1,'Invoiced':1.08,'Collected':.82,'Milestone-based':.9};
const CATS=[
 {n:'Infrastructure',v:2.4},{n:'Third Party Solutions',v:3.1},{n:'Software',v:2.2},{n:'Marketing',v:1.5},{n:'Sales',v:1.2},{n:'Consulting',v:2.6},{n:'Salary',v:22.0,restricted:true}];
const PRJ=[
 {id:'PRJ-101',n:'Retail Portal Revamp',c:'Northwind Retail',pm:'Asha',s:'Active',h:'Amber',bud:18,rev:12.5,cost:7.4,oh:1.1,est:900,act:842,p:68,mem:5,scope:'Storefront redesign, checkout, catalogue filters, admin console',ms:['Design sign-off ✔','Checkout beta (in progress)','UAT','Go-live']},
 {id:'PRJ-102',n:'Learning App Pilot',c:'Lumen Academy',pm:'Asha',s:'Active',h:'Green',bud:9,rev:6.0,cost:3.1,oh:.6,est:520,act:455,p:74,mem:3,scope:'Quiz engine, teacher dashboard, progress reports',ms:['Prototype ✔','Pilot release (in progress)','Feedback round']},

 fin:{emp2:'Full',pm2:'View',al2:'View',set2:'Manage',cost2:'Full',rev2:'Manage',prof2:'Full',tag2:'Full',chk2:'View'},
 ops:{emp2:'View',pm2:'Manage',al2:'Manage',set2:'View',cost2:'View'},pm:{pm2:'Delegated',al2:'Delegated',cost2:'Delegated'},tl:{al2:'View'}};

 emp2:{ceo:['Create and edit employees, departments and Heads of Department','See and change salaries (restricted capability)'],fin:['See and maintain salaries','Review cost per hour and bench cost'],ops:['See employees, departments and allocation','Salary and cost are not shown to this role']},
 pm2:{ceo:['Create tags and assign them to projects','Filter any report by tag'],fin:['Filter financial reports by tag'],ops:['Create tags and assign them to projects'],pm:['Tag assigned projects only']},
 al2:{ceo:['Allocate employees to projects per month','Over-allocation above 100% is rejected'],fin:['View allocation (read-only)'],ops:['Allocate employees to projects','See hours; salary cost is hidden'],pm:['Allocate people on assigned projects only'],tl:['See allocation of your team (read-only)']},
 set2:{ceo:['Set monthly hours and standard hourly rate; override per employee / project'],fin:['Maintain costing settings (audited)'],ops:['Read-only view of the settings']},
 cost2:{ceo:['Effort and cost by employee, project and tag'],fin:['Effort and cost by employee, project and tag'],ops:['Effort hours only; cost and value are restricted'],pm:['Effort hours for assigned projects only; no salary data']},
 rev2:{ceo:['Define revenue targets per project and see them against standard value and cost'],fin:['Define and maintain revenue targets']},
 prof2:{ceo:['Project profitability from salary cost and revenue basis'],fin:['Project profitability from salary cost and revenue basis']},
 tag2:{ceo:['Financial analysis by project tag with drill-down'],fin:['Financial analysis by project tag with drill-down']},
 chk2:{ceo:['Compare the workbook totals with the corrected calculation'],fin:['Compare the workbook totals with the corrected calculation']}};
ROLES.forEach(r=>{Object.assign(r.acc,ACC[r.id]||{});Object.keys(CAN).forEach(k=>{if(CAN[k][r.id])r.can[k]=CAN[k][r.id]})});

 `<div class="tools"><input id="r2_q" type="search" placeholder="Search employee…" value="${esc(R.q)}" aria-label="Search employee"><label>Department <select id="r2_dep"><option>All</option>${DEPT.map(d=>`<option ${R.dep===d.n?'selected':''}>${esc(d.n)}</option>`).join('')}</select></label><span class="spacer"></span>${canEdit('emp')?'<button class="btn pri" data-r2="addEmp">+ Add employee</button>':''}</div>`+
 `<div class="card flat"><div class="tw"><table><thead><tr><th>Employee</th><th>Title</th><th>Department</th><th>Head of Department</th><th class="n">Monthly salary</th><th class="n">Cost / hour</th><th>Allocation</th><th></th></tr></thead><tbody>${rows.map(i=>{const x=EM[i],e=E(i),d=DEPT.find(d=>d.n===x.d);return `<tr><td><b>${esc(x.n)}</b></td><td>${esc(x.t)}</td><td>${esc(x.d)}</td><td>${esc(d.hod)}${d.hod===x.n?' '+chip('HoD','acc'):''}</td><td class="n">${mk(x.s)}</td><td class="n">${canCost()?INR(x.s/hrs(i))+'/h':'<span class="chip">Restricted</span>'}</td><td>${empStatus(e.al)}</td><td>${canEdit('emp')?`<button class="btn sm" data-r2="editEmp:${i}">Edit</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`+
 `<h2 style="margin-top:20px">Departments and Heads of Department</h2><div class="card flat"><div class="tw"><table><thead><tr><th>Department</th><th>Head of Department</th><th class="n">Headcount</th><th class="n">Salary pool</th></tr></thead><tbody>${DEPT.map((d,di)=>`<tr><td><b>${esc(d.n)}</b></td><td>${canEdit('emp')?`<select data-r2hod="${di}" aria-label="Head of ${esc(d.n)}">${EM.filter(x=>x.d===d.n).map(x=>`<option ${x.n===d.hod?'selected':''}>${esc(x.n)}</option>`).join('')}</select>`:esc(d.hod)}</td><td class="n">${EM.filter(x=>x.d===d.n).length}</td><td class="n">${mk(sumN(EM.length,i=>EM[i].d===d.n?EM[i].s:0))}</td></tr>`).join('')}</tbody></table></div></div>`+

};

VIEWS.pm2=()=>{

 `<div class="grid g4 mb">${kpi('Projects in filter',ids.length,R.tagF.length?'Tags: '+R.tagF.join(' + '):'No tag filter')}${kpi('Effort',NUM(a.h)+' h','Planned this month')}${kpi('Salary cost',mk(a.c),'Allocation × salary')}${kpi('Standard value',mk(a.v),'Hours × hourly rate')}</div>`+
 `<div class="card flat"><div class="tw"><table><thead><tr><th>Code</th><th>Project</th><th>Tags</th>${edit?'<th>Add tag</th>':''}<th class="n">Hours</th></tr></thead><tbody>${ids.map(i=>`<tr><td>${PR[i].id}</td><td><b>${esc(PR[i].n)}</b></td><td>${PR[i].tags.map(t=>`<span class="chip c-acc r2tag">${esc(t)}${edit?`<button data-r2="untag:${i}|${t}" aria-label="Remove tag ${esc(t)}">×</button>`:''}</span>`).join('')}</td>${edit?`<td><select data-r2addtag="${i}" aria-label="Add tag to ${esc(PR[i].n)}"><option value="">+ tag…</option>${TAGS.filter(t=>!PR[i].tags.includes(t)).map(t=>`<option>${esc(t)}</option>`).join('')}</select></td>`:''}<td class="n">${NUM(P(i).h)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No project carries all selected tags.</div></td></tr>'}</tbody></table></div></div>`+

 `<div class="tools"><label>Month <select aria-label="Month"><option>November 2026</option><option disabled>December 2026 (copy forward)</option></select></label><span class="spacer"></span>${edit?'<button class="btn" data-r2="copyfwd">Copy to next month</button><button class="btn" data-r2="reset">Reset to workbook baseline</button><button class="btn" data-r2="clear">Clear all</button>':''}</div>`+
 `<div class="card flat"><div class="tw"><table class="al"><thead><tr><th class="nm">Employee</th>${ps.map(p=>`<th class="n" title="${esc(PR[p].n)}">${PR[p].id}</th>`).join('')}<th class="n">Total</th><th class="n">Hours</th><th class="n">Bench</th></tr></thead><tbody>${es.map(e=>{const x=E(e);return `<tr><td class="nm"><b>${esc(EM[e].n)}</b><br><small>${esc(EM[e].d)}</small></td>${ps.map(p=>`<td class="n">${edit?`<input class="r2in" id="r2a_${p}_${e}" data-r2al="${p},${e}" inputmode="numeric" value="${A[p][e]?Math.round(A[p][e]*100):''}" placeholder="–" aria-label="${esc(EM[e].n)} on ${esc(PR[p].n)} percent">`:(A[p][e]?Math.round(A[p][e]*100)+'%':'–')}</td>`).join('')}<td class="n"><b class="${x.al>1.0001?'neg':''}">${Math.round(x.al*100)}%</b></td><td class="n">${NUM(x.h)}</td><td class="n">${x.bench>.001?chip(Math.round(x.bench*100)+'% free','warn'):'–'}</td></tr>`}).join('')}</tbody><tfoot><tr><td class="nm">Project hours</td>${ps.map(p=>`<td class="n">${NUM(P(p).h)}</td>`).join('')}<td class="n">${NUM(sumN(ps.length,i=>P(ps[i]).h))}</td><td></td><td></td></tr><tr><td class="nm">Salary cost</td>${ps.map(p=>`<td class="n">${canCost()?INR(P(p).c).replace('₹',''):'–'}</td>`).join('')}<td class="n">${canCost()?INR(sumN(ps.length,i=>P(ps[i]).c)):'–'}</td><td></td><td></td></tr></tfoot></table></div></div>`+
 `<p class="sub" style="margin-top:10px">${ps.map(p=>`<b>${PR[p].id}</b> ${esc(PR[p].n)}`).join(' · ')}</p>`+
 note('Try it: type 50 for Esha Kulkarni on P01. She is already 100% on P02, so the entry is rejected with a clear message (rule FR-R2-C2). Lower an existing value first, then add it elsewhere.');

 `<div class="grid g2 mb"><div class="card"><h2>Organization defaults</h2><div class="f"><label>Monthly working hours per employee<input class="r2in w" id="r2_hours" value="${org.hours}" ${edit?'':'disabled'} inputmode="numeric"></label><label>Standard hourly rate (₹) <small>internal value of effort, see D-R2-05</small><input class="r2in w" id="r2_rate" value="${org.rate}" ${edit?'':'disabled'} inputmode="numeric"></label></div><p class="sub" style="margin-top:10px">Valid hours 1–300; rate above 0. Changes apply to open months and are audited.</p></div>

 `<div class="grid g2"><div class="card flat"><div style="padding:14px 16px 0"><h2>Hourly rate override per project</h2><small>Blank = inherit the organization rate</small></div><div class="tw"><table><thead><tr><th>Project</th><th class="n">Rate ₹/h</th></tr></thead><tbody>${PR.map((p,i)=>`<tr><td>${p.id} ${esc(p.n)}</td><td class="n"><input class="r2in w" id="r2_pr_${i}" data-r2rate="${i}" inputmode="numeric" placeholder="${org.rate}" value="${p.rate??''}" ${edit?'':'disabled'} aria-label="Rate override for ${esc(p.n)}">${p.rate!=null?' '+chip('override','warn'):''}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card flat"><div style="padding:14px 16px 0"><h2>Monthly hours override per employee</h2><small>For part-time staff. Blank = inherit</small></div><div class="tw"><table><thead><tr><th>Employee</th><th class="n">Hours / month</th></tr></thead><tbody>${EM.map((x,i)=>`<tr><td>${esc(x.n)}</td><td class="n"><input class="r2in w" id="r2_eh_${i}" data-r2hrs="${i}" inputmode="numeric" placeholder="${org.hours}" value="${x.ho??''}" ${edit?'':'disabled'} aria-label="Hours override for ${esc(x.n)}">${x.ho!=null?' '+chip('override','warn'):''}</td></tr>`).join('')}</tbody></table></div></div></div>`;

 let body='';

 if(R.tab==='By project')body=`<div class="tw"><table><thead><tr><th>Project</th><th>Tags</th><th class="n">People</th><th class="n">Hours</th><th class="n">Standard value</th><th class="n">Salary cost</th></tr></thead><tbody>${ps.map(p=>{const x=P(p);return `<tr><td><button class="btn sm" style="border:0;font-weight:700" data-r2="prj:${p}">${esc(PR[p].n)}</button></td><td>${PR[p].tags.map(t=>chip(t,'acc')).join(' ')}</td><td class="n">${EM.filter((_,e)=>A[p][e]>0).length}</td><td class="n">${NUM(x.h)}</td><td class="n">${mk(x.v)}</td><td class="n">${mk(x.c)}</td></tr>`}).join('')}</tbody></table></div>`;
 if(R.tab==='By tag')body=`<div class="tw"><table><thead><tr><th>Tag</th><th class="n">Projects</th><th class="n">Hours</th><th class="n">Standard value</th><th class="n">Salary cost</th></tr></thead><tbody>${tagRows().map(([t,ids])=>{const a=agg(ids.filter(i=>ps.includes(i)));return `<tr><td>${chip(t,'acc')}</td><td class="n">${a.n}</td><td class="n">${NUM(a.h)}</td><td class="n">${mk(a.v)}</td><td class="n">${mk(a.c)}</td></tr>`}).join('')}</tbody></table></div><p class="sub" style="margin:10px 14px">Projects can carry several tags, so tag rows overlap and must not be added together.</p>`;

VIEWS.rev2=()=>{
 const ps=pScope(),edit=['ceo','fin'].includes(state.role);
 const tg=ps.filter(p=>PR[p].tgt!=null),tsum=sumN(tg.length,i=>PR[tg[i]].tgt),vsum=sumN(tg.length,i=>P(tg[i]).v);
 return head('Revenue Targets · Revision 2','Define a monthly revenue target per project and compare it with the standard value of planned effort and with cost.')+
 `<div class="grid g4 mb">${kpi('Projects with a target',tg.length+' of '+ps.length,'Others show “Not set”')}${kpi('Sum of project targets',INR(tsum),'November 2026')}${kpi('Standard value on those projects',INR(vsum),'Hours × rate')}${kpi('Gap to target',INR(vsum-tsum),vsum>=tsum?'Planned effort covers the targets':'Planned effort falls short')}</div>`+
 `<div class="card flat"><div class="tw"><table><thead><tr><th>Project</th><th>Tags</th><th class="n">Target (₹)</th><th class="n">Standard value</th><th class="n">Value − target</th><th>Planned value vs target</th><th class="n">Salary cost</th><th class="n">Margin at target</th></tr></thead><tbody>${ps.map(p=>{const x=P(p),t=PR[p].tgt;return `<tr><td><b>${esc(PR[p].n)}</b></td><td>${PR[p].tags.map(g=>chip(g)).join(' ')}</td><td class="n">${edit?`<input class="r2in w" id="r2_t_${p}" data-r2tgt="${p}" inputmode="numeric" placeholder="Not set" value="${t??''}" aria-label="Target for ${esc(PR[p].n)}">`:(t==null?'Not set':INR(t))}</td><td class="n">${mk(x.v)}</td><td class="n">${t==null?'–':`<span class="${x.v>=t?'pos':'neg'}">${INR(x.v-t)}</span>`}</td><td>${t==null?chip('No target set','warn'):bar(pct(x.v,t),tone(pct(x.v,t)))+` <small>${pct(x.v,t)}%</small>`}</td><td class="n">${mk(x.c)}</td><td class="n">${t==null?'–':mk(t-x.c)}</td></tr>`}).join('')}</tbody></table></div></div>`+

VIEWS.prof2=()=>{

 return head('Project Profitability','Revenue basis minus salary cost for each project, with the unallocated salary shown separately.')+
 `<div class="tools"><label>Revenue basis <select id="r2_basis"><option ${R.basis===0?'selected':''}>Standard value (hours × rate)</option><option ${R.basis===1?'selected':''}>Revenue target (where set)</option></select></label><label style="display:inline-flex;gap:6px"><input type="checkbox" id="r2_other" ${R.other?'checked':''}> Include non-salary budget categories <small>(optional, D-R2-06)</small></label></div>`+
 `<div class="grid g4 mb">${kpi('Revenue basis',mk(rev),`${ok.length} of ${rows.length} projects`)}${kpi('Salary cost',mk(c),R.other?'plus '+INR(oc)+' other':'Allocation × salary')}${kpi('Margin',canCost()?`<span class="${m>=0?'pos':'neg'}">${INR(m)}</span>`:mk(m),canCost()&&rev?Math.round(m/rev*1000)/10+'% of revenue basis':'')}${kpi('Unallocated salary (bench)',mk(o.bench),'Not charged to any project')}</div>`+
 `<div class="card flat"><div class="tw"><table><thead><tr><th>Project</th><th class="n">Revenue basis</th><th class="n">Salary cost</th>${R.other?'<th class="n">Other direct</th>':''}<th class="n">Margin</th><th>Margin %</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(PR[r.p].n)}</b></td><td class="n">${r.rv==null?'–':mk(r.rv)}</td><td class="n">${mk(r.x.c)}</td>${R.other?`<td class="n">${mk(r.oc)}</td>`:''}<td class="n">${r.m==null||!canCost()?(r.m==null?'–':mk(r.m)):`<span class="${r.m>=0?'pos':'neg'}">${INR(r.m)}</span>`}</td><td>${r.m==null||!canCost()||!r.rv?'–':bar(Math.max(0,Math.round(r.m/r.rv*100)),mTone(r.m/r.rv))+' <small>'+Math.round(r.m/r.rv*100)+'%</small>'}</td><td>${r.rv==null?chip('Target not set','warn'):r.m<0?chip('Loss','bad'):chip('Profit','ok')}</td></tr>`).join('')}</tbody><tfoot><tr><td><b>Allocated work</b></td><td class="n">${mk(rev)}</td><td class="n">${mk(c)}</td>${R.other?`<td class="n">${mk(oc)}</td>`:''}<td class="n">${mk(m)}</td><td></td><td></td></tr><tr><td>Unallocated salary (bench)</td><td></td><td class="n">${mk(o.bench)}</td>${R.other?'<td></td>':''}<td class="n">${canCost()?`<span class="neg">${INR(-o.bench)}</span>`:mk(0)}</td><td></td><td></td></tr><tr><td><b>Result after bench</b></td><td></td><td></td>${R.other?'<td></td>':''}<td class="n"><b>${mk(m-o.bench)}</b></td><td></td><td></td></tr></tfoot></table></div></div>`+
 note('Revenue basis is an open decision (D-R2-01). “Standard value” is hours × rate, not invoiced revenue. Projects with no target are excluded when the target basis is selected, and the count is shown.');
};

VIEWS.tag2=()=>{
 const rows=tagRows().map(([t,ids])=>({t,ids,a:agg(ids)})),max=Math.max(...rows.map(r=>r.a.v),1);
 return head('Tag-wise Analysis','Financial analysis by project tag with drill-down to projects.')+
 `<div class="tools"><label style="display:inline-flex;gap:6px"><input type="checkbox" id="r2_primary" ${R.primary?'checked':''}> Use primary tag only (additive view)</label></div>`+
 (R.primary?note('Each project is counted once, under its first tag, so the rows add up to the organization total.'):`<div class="note w mb">Projects can carry several tags, so tag rows overlap. Do not add them together. Switch on “primary tag only” for an additive view.</div>`)+
 `<div class="grid g2"><div class="card flat"><div class="tw"><table><thead><tr><th>Tag</th><th class="n">Projects</th><th class="n">Hours</th><th class="n">Standard value</th><th class="n">Salary cost</th><th class="n">Margin</th><th class="n">%</th><th></th></tr></thead><tbody>${rows.map(r=>{const m=r.a.v-r.a.c;return `<tr><td>${chip(r.t,'acc')}</td><td class="n">${r.a.n}</td><td class="n">${NUM(r.a.h)}</td><td class="n">${mk(r.a.v)}</td><td class="n">${mk(r.a.c)}</td><td class="n">${canCost()?`<span class="${m>=0?'pos':'neg'}">${INR(m)}</span>`:mk(m)}</td><td class="n">${canCost()&&r.a.v?Math.round(m/r.a.v*100)+'%':'–'}</td><td><button class="btn sm" data-r2="tagdrill:${r.t}">Projects</button></td></tr>`}).join('')}</tbody>${R.primary?`<tfoot><tr><td>Total</td><td class="n">${sumN(rows.length,i=>rows[i].a.n)}</td><td class="n">${NUM(sumN(rows.length,i=>rows[i].a.h))}</td><td class="n">${mk(sumN(rows.length,i=>rows[i].a.v))}</td><td class="n">${mk(sumN(rows.length,i=>rows[i].a.c))}</td><td class="n">${mk(sumN(rows.length,i=>rows[i].a.v-rows[i].a.c))}</td><td></td><td></td></tr></tfoot>`:''}</table></div></div>
 <div class="card"><h2>Margin by tag</h2>${canCost()?hbars(rows.map(r=>({n:r.t,v:Math.max(0,r.a.v-r.a.c),t:mTone((r.a.v-r.a.c)/(r.a.v||1))})),v=>INR(v)):'<div class="empty">Financial values are restricted for this role.</div>'}</div></div>`;
};

VIEWS.chk2=()=>{
 const base={};PR.forEach((_,p)=>{base[p]=Object.entries(BASE[p]||{}).reduce((s,[e,v])=>s+v*EM[e].s,0)});
 const cc=PR.map((_,p)=>base[p]),exc=EXCEL_COST,tc=cc.reduce((a,b)=>a+b,0),te=exc.reduce((a,b)=>a+b,0);
 return head('Excel Check','The workbook’s allocation model compared with the corrected calculation (baseline allocations, independent of edits above).')+
 `<div class="grid g4 mb">${kpi('Effort hours','1,760 h','Workbook and system agree')}${kpi('Standard value','₹4,40,000','Workbook and system agree')}${kpi('Salary cost, workbook',INR(te),'Formula error')}${kpi('Salary cost, corrected',INR(tc),'Each person’s own salary')}</div>`+
 `<div class="card flat"><div class="tw"><table><thead><tr><th>Project</th><th class="n">Workbook cost</th><th class="n">Corrected cost</th><th class="n">Difference</th><th>Result</th></tr></thead><tbody>${PR.map((p,i)=>`<tr><td>${p.id} ${esc(p.n)}</td><td class="n">${INR(exc[i])}</td><td class="n">${INR(cc[i])}</td><td class="n">${exc[i]-cc[i]?`<span class="neg">${INR(exc[i]-cc[i])}</span>`:'–'}</td><td>${exc[i]===cc[i]?chip('Matches','ok'):chip('Overstated','bad')}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="n">${INR(te)}</td><td class="n">${INR(tc)}</td><td class="n"><span class="neg">${INR(te-tc)}</span></td><td></td></tr></tfoot></table></div></div>`+
 `<div class="card mb" style="margin-top:14px"><h2>Why the totals differ</h2><ul class="can"><li>On projects 2 to 11 the workbook multiplies every allocation by one fixed salary cell (₹30,000) instead of each employee’s own salary. Project 1 is correct.</li><li>Three employees are at 0% (₹60,000 of monthly salary) and are not reported anywhere in the workbook. The system shows them as bench cost.</li><li>The workbook’s “Revenue” is hours × ₹250: a standard value of effort, not invoiced revenue. Only three projects have a real revenue target.</li></ul></div>`+note('Decision D-R2-02: confirm that the corrected cost of ₹2,00,000 is the intended result.');
};

/* ----- dashboard snapshot and cross references on older screens ----- */
const dash0=VIEWS.dash;
VIEWS.dash=()=>{let h=dash0();if(!canCost())return h;const o=ORG();return h+`<h2 style="margin-top:20px">Revision 2 snapshot · November 2026 <span class="r2new">NEW</span></h2><div class="grid g4 mb">${kpi('Planned effort',NUM(o.h).toLocaleString('en-IN')+' h','14 employees, 11 projects')}${kpi('Standard value',INR(o.v),'Hours × ₹'+org.rate)}${kpi('Salary cost (allocated)',INR(o.c),'Unallocated '+INR(o.bench))}${kpi('Margin',`<span class="${o.v-o.c>=0?'pos':'neg'}">${INR(o.v-o.c)}</span>`,Math.round((o.v-o.c)/o.v*100)+'% of standard value')}</div><div class="tools"><button class="btn" data-view="al2">Open allocation</button><button class="btn" data-view="prof2">Open profitability</button><button class="btn" data-view="tag2">Open tag analysis</button></div>`};
['revenue','expenses'].forEach(k=>{const f=VIEWS[k];VIEWS[k]=()=>f()+`<div class="note w" style="margin-top:14px"><b>Revision 2:</b> salary-allocation costing, tags and project profitability are specified in PRD Part B and shown under “Costing &amp; Profitability”. This screen is retained and will be aligned after review.</div>`});

/* ----- decisions, matrix rows ----- */
ASSUME.push(
 ['Revision 2 · Revenue basis for profitability (D-R2-01)','Workbook “Revenue” is hours × ₹250 (a standard value), not actual revenue. Only 3 of 11 projects have a target.','Show standard value as planned value, targets separately; add actual revenue when invoicing exists.','Open'],
 ['Revision 2 · Corrected workbook totals (D-R2-02)','Workbook cost ₹3,07,500 results from one salary cell used for all employees; corrected cost is ₹2,00,000.','Adopt the corrected formula; confirm with the business owner.','Open'],
 ['Revision 2 · S / H markers (D-R2-04)','S falls on every Sunday of Nov 2026; H on four other days.','Treat as weekly off and holiday, configurable, pending confirmation.','Open'],
 ['Revision 2 · Monthly hours and hourly rate (D-R2-05, D-R2-13)','160 h and ₹250 given. November calendar implies about 168 working hours.','Flat 160 default; organization default with per-employee hours and per-project rate overrides.','Open'],
 ['Revision 2 · Tags, Head of Department, over-allocation (D-R2-08, 09, 11)','Not defined in the workbook.','Managed tag list with many tags per project; HoD sees effort not salary; allocation above 100% is blocked.','Open']);
MX.push(['Employee, Department & Salary (Rev 2)',1,'P0',['Full','Full','View',N,N,N,N,N,'Manage']],['Project Tags (Rev 2)',1,'P0',['Full','View','Full','Delegated',N,N,N,N,N]],['Employee Allocation (Rev 2)',1,'P0',['Full','View','Manage','Delegated','View',N,N,N,N]],['Costing Settings (Rev 2)',1,'P0',['Full','Manage','View',N,N,N,N,N,N]],['Effort, Cost & Profitability (Rev 2)',1,'P0',['Full','Full','View','Delegated',N,N,N,N,N]]);

/* ----- events ----- */
function openCalc(kind,i){
 if(kind==='emp'){const x=EM[i];const rows=PR.map((p,pi)=>[p,pi]).filter(([,pi])=>A[pi][i]>0);
  return modal(x.n+' · calculation',`<p class="sub">${esc(x.t)}, ${esc(x.d)}. Monthly hours ${hrs(i)}; salary ${canCost()?INR(x.s):'restricted'}.</p><table><thead><tr><th>Project</th><th class="n">Allocation</th><th class="n">Effort</th><th class="n">Cost</th></tr></thead><tbody>${rows.map(([p,pi])=>`<tr><td>${esc(p.n)}</td><td class="n">${Math.round(A[pi][i]*100)}%</td><td class="n">${Math.round(A[pi][i]*100)}% × ${hrs(i)} = <b>${NUM(effort(pi,i))} h</b></td><td class="n">${canCost()?`${Math.round(A[pi][i]*100)}% × ${INR(x.s)} = <b>${INR(cost(pi,i))}</b>`:'Restricted'}</td></tr>`).join('')||'<tr><td colspan="4">On the bench: no allocation this month.</td></tr>'}</tbody></table>`)}
 const p=PR[i],x=P(i),rows=EM.map((e,ei)=>ei).filter(ei=>A[i][ei]>0);
 modal(p.n+' · calculation',`<p>${p.tags.map(t=>chip(t,'acc')).join(' ')} · rate ₹${rateOf(i)}/h${p.rate!=null?' (override)':''}</p><table><thead><tr><th>Employee</th><th class="n">Allocation</th><th class="n">Hours</th><th class="n">Cost</th></tr></thead><tbody>${rows.map(ei=>`<tr><td>${esc(EM[ei].n)}</td><td class="n">${Math.round(A[i][ei]*100)}%</td><td class="n">${NUM(effort(i,ei))}</td><td class="n">${canCost()?`${Math.round(A[i][ei]*100)}% × ${INR(EM[ei].s)} = ${INR(cost(i,ei))}`:'Restricted'}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td><td class="n"><b>${NUM(x.h)} h</b></td><td class="n"><b>${mk(x.c)}</b></td></tr></tfoot></table><p style="margin-top:10px">Standard value = ${NUM(x.h)} h × ₹${rateOf(i)} = <b>${mk(x.v)}</b>${canCost()?` · Margin = ${INR(x.v)} − ${INR(x.c)} = <b>${INR(x.v-x.c)}</b>`:''}</p>`);
}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-r2]');if(!t)return;const [a,arg]=t.dataset.r2.split(/:(.*)/s);
 if(a==='tagf'){R.tagF=R.tagF.includes(arg)?R.tagF.filter(x=>x!==arg):[...R.tagF,arg];return render()}
 if(a==='tagclear'){R.tagF=[];return render()}
 if(a==='untag'){const [i,tg]=arg.split('|');if(PR[i].tags.length<2){toast('A project keeps at least one tag (validation example).');return}PR[i].tags=PR[i].tags.filter(x=>x!==tg);toast('Tag removed (illustrative; the change would be audited).');return render()}
 if(a==='newTag'){const v=($('#r2_newtag').value||'').trim();if(!v||v.length>40)return toast('Enter a tag name of 1–40 characters.');if(TAGS.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('That tag already exists (names are unique, case-insensitive).');TAGS.push(v);toast('Tag “'+v+'” added.');return render()}
 if(a==='tab'){R.tab=arg;return render()}
 if(a==='reset'){loadBase();toast('Allocations reset to the workbook baseline.');return render()}
 if(a==='clear'){A.forEach(r=>r.fill(0));toast('All allocations cleared. Everyone is on the bench.');return render()}
 if(a==='copyfwd')return toast('Illustrative: November allocations would be copied to December for review.');
 if(a==='emp')return openCalc('emp',+arg);
 if(a==='prj')return openCalc('prj',+arg);
 if(a==='tagdrill'){const r=tagRows().find(([n])=>n===arg);return modal('Projects tagged “'+arg+'”',`<table><thead><tr><th>Project</th><th class="n">Hours</th><th class="n">Value</th><th class="n">Cost</th></tr></thead><tbody>${r[1].map(i=>`<tr><td>${esc(PR[i].n)}</td><td class="n">${NUM(P(i).h)}</td><td class="n">${mk(P(i).v)}</td><td class="n">${mk(P(i).c)}</td></tr>`).join('')}</tbody></table>`)}
 if(a==='addEmp'||a==='editEmp'){const x=a==='editEmp'?EM[+arg]:{n:'',d:'Engineering',t:'',s:''};
  return modal(a==='addEmp'?'Add employee':'Edit employee',`<div class="f"><label>Name<input id="m_n" value="${esc(x.n)}"></label><label>Title<input id="m_t" value="${esc(x.t)}"></label><label>Department<select id="m_d">${DEPT.map(d=>`<option ${d.n===x.d?'selected':''}>${esc(d.n)}</option>`).join('')}</select></label>${canCost()?`<label>Monthly salary (₹, cost-to-company)<input id="m_s" inputmode="numeric" value="${x.s}"></label>`:''}</div>`,'Save',()=>{
   const n=$('#m_n').value.trim(),s=+($('#m_s')?.value||x.s||0);if(!n||!(s>0)){toast('Enter a name and a salary above 0 (validation example).');return false}
   if(a==='addEmp'){EM.push({n,d:$('#m_d').value,t:$('#m_t').value,s,ho:null});A.forEach(r=>r.push(0))}else{Object.assign(EM[+arg],{n,d:$('#m_d').value,t:$('#m_t').value,s})}
   toast('Saved (illustrative). A salary change is effective-dated and audited.');render()})}
});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
 if(t.id==='r2_dep'){R.dep=t.value;return render()}
 if(t.id==='r2_basis'){R.basis=t.selectedIndex;return render()}
 if(t.id==='r2_other'){R.other=t.checked;return render()}
 if(t.id==='r2_primary'){R.primary=t.checked;return render()}
 if(d.r2hod!==undefined){DEPT[+d.r2hod].hod=t.value;return toast('Head of Department changed to '+t.value+' (audited).')}
 if(d.r2addtag!==undefined&&t.value){PR[+d.r2addtag].tags.push(t.value);toast('Tag added to project.');return render()}
});
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
 if(t.id==='r2_q'){R.q=t.value;return render()}
 if(d.r2al){const [p,e]=d.r2al.split(',').map(Number),raw=t.value.trim(),v=raw===''?0:Number(raw);
  if(!Number.isFinite(v)||v<0||v>100){toast('Allocation must be between 0 and 100 percent.');return render()}
  const others=E(e).al-A[p][e];if(others+v/100>1.0001){toast(EM[e].n+' would be at '+Math.round((others+v/100)*100)+'%. The limit is 100%, so the entry is rejected.');return render()}
  A[p][e]=v/100;return render()}
 if(t.id==='r2_hours'||t.id==='r2_rate'){const v=Number(t.value);const lo=t.id==='r2_hours'?1:0.01,hi=t.id==='r2_hours'?300:1e6;if(!(v>=lo&&v<=hi)){toast(t.id==='r2_hours'?'Monthly hours must be between 1 and 300.':'The hourly rate must be above 0.');return}org[t.id==='r2_hours'?'hours':'rate']=v;return render()}
 if(d.r2rate!==undefined){const v=t.value.trim();PR[+d.r2rate].rate=v===''?null:(Number(v)>0?Number(v):null);return render()}
 if(d.r2hrs!==undefined){const v=t.value.trim();EM[+d.r2hrs].ho=v===''?null:(Number(v)>=1&&Number(v)<=300?Number(v):null);return render()}
 if(d.r2tgt!==undefined){const v=t.value.trim();PR[+d.r2tgt].tgt=v===''?null:(Number(v)>=0?Number(v):null);return render()}
});
renderShell();render();
})();
</script>

</body>
